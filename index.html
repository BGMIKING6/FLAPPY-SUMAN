<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Adventure</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div id="game-container">
    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="360" height="640"></canvas>

   <!-- Initial Tap to Enter Overlay (Bypasses Autoplay Restrictions) -->
    <div id="start-overlay" class="overlay-screen">
      <div class="glass-card bounce-anim">
        <h1 class="glow-text">APS KA BAAP</h1>
        <p class="subtitle">TAP ANYWHERE TO START</p>
        <div class="pulse-icon">👆</div>
      </div>
    </div>

    <!-- Main Menu Overlay -->
    <div id="main-menu" class="overlay-screen hidden">
      <div class="glass-card">
        <h1 class="glow-text">APS KA BAAP</h1>
        <p id="menu-target-desc" class="badge">SCORE TO ADVANCE</p>
        <button id="start-btn" class="btn primary-btn">PLAY NOW 🎮</button>
      </div>
    </div>
    <!-- HUD -->
    <div id="hud">
      <div class="hud-box">
        <span class="hud-label">LEVEL</span>
        <span id="hud-level" class="hud-value">1</span>
      </div>
      <div class="hud-box score-box">
        <span class="hud-label">SCORE</span>
        <span id="hud-score" class="hud-value">0</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">TARGET</span>
        <span id="hud-target" class="hud-value">5</span>
      </div>
    </div>

    <!-- Tap Hint -->
    <div id="tap-hint" class="hint-screen hidden">
      <div class="tap-badge">TAP TO FLAP</div>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over" class="overlay-screen hidden">
      <div class="glass-card">
        <h2 class="danger-text">GAME OVER</h2>
        <div class="stats-container">
          <div class="stat-row">
            <span>SCORE</span>
            <span id="final-score" class="stat-val">0</span>
          </div>
          <div class="stat-row">
            <span>BEST SCORE</span>
            <span id="high-score" class="stat-val">0</span>
          </div>
        </div>
        <button id="restart-btn" class="btn danger-btn">MAIN MENU 🏠</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
