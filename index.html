<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Challenge - APS KA BAAP Edition</title>
  <style>
    /* ==================== GLOBAL STYLES ==================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #090a0f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ==================== GAME CONTAINER ==================== */
    #game-container {
      position: relative;
      width: 420px;
      height: 640px;
      background: linear-gradient(to bottom, #111425 0%, #080911 100%);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0, 255, 204, 0.25), 0 0 80px rgba(255, 0, 128, 0.15);
      border: 3px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ==================== RGB RAINBOW ANIMATION ==================== */
    @keyframes rgbGlow {
      0% { text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 30px #ff0055; color: #ff0055; }
      20% { text-shadow: 0 0 10px #ff9900, 0 0 20px #ff9900, 0 0 30px #ff9900; color: #ff9900; }
      40% { text-shadow: 0 0 10px #33ff00, 0 0 20px #33ff00, 0 0 30px #33ff00; color: #33ff00; }
      60% { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; color: #00ffff; }
      80% { text-shadow: 0 0 10px #9900ff, 0 0 20px #9900ff, 0 0 30px #9900ff; color: #9900ff; }
      100% { text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 30px #ff0055; color: #ff0055; }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* ==================== OVERLAY SCREENS ==================== */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(8, 9, 17, 0.88);
      backdrop-filter: blur(8px);
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    /* Developer Title Banner */
    .dev-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: rgbGlow 3s infinite linear, pulseGlow 2s infinite ease-in-out;
      margin-bottom: 5px;
      text-align: center;
    }

    .game-title {
      font-size: 38px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    /* Target & Level Badges */
    .info-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 15px 25px;
      margin-bottom: 25px;
      text-align: center;
      width: 80%;
    }

    .info-card h3 {
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .info-card p {
      font-size: 22px;
      font-weight:bold;
      color: #00ffcc;
    }

    /* Action Buttons */
    .btn {
      background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
      color: #fff;
      border: none;
      padding: 16px 45px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 0, 127, 0.4);
      transition: all 0.2s ease;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 30px rgba(255, 0, 127, 0.6);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    /* HUD Header */
    #hud {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    .hud-box span {
      color: #00ffcc;
    }

    #tap-hint {
      position: absolute;
      bottom: 120px;
      width: 100%;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 1px;
      z-index: 5;
      animation: pulseGlow 1.2s infinite ease-in-out;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- HUD Header Display -->
  <div id="hud">
    <div class="hud-box">LVL: <span id="hud-level">1</span></div>
    <div class="hud-box">SCORE: <span id="hud-score">0</span></div>
    <div class="hud-box">TARGET: <span id="hud-target">5</span></div>
  </div>

  <div id="tap-hint" class="hidden">TAP TO FLY</div>

  <!-- CANVAS -->
  <canvas id="gameCanvas" width="420" height="640"></canvas>

  <!-- MAIN MENU SCREEN -->
  <div id="main-menu" class="screen">
    <div class="dev-title">DEVELOPER APS KA BAAP</div>
    <div class="game-title">FLAPPY ULTRA</div>

    <div class="info-card">
      <h3>Level 1 Target</h3>
      <p id="menu-target-desc">SCORE 5 TO ADVANCE</p>
    </div>

    <button class="btn" onclick="startGame()">PLAY GAME</button>
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="game-over" class="screen hidden">
    <div style="font-size: 32px; font-weight: 900; color: #ff0055; margin-bottom: 10px;">CRASHED!</div>
    
    <div class="info-card">
      <h3>Final Score</h3>
      <p id="final-score">0</p>
      <h3 style="margin-top: 10px;">High Score</h3>
      <p id="high-score" style="color: #ffaa00;">0</p>
    </div>

    <button class="btn" onclick="returnToMainMenu()">MAIN MENU</button>
  </div>
</div>

<script>
  // ==================== CANVAS & SETUP ====================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // DOM Elements
  const mainMenu = document.getElementById('main-menu');
  const gameOverMenu = document.getElementById('game-over');
  const tapHint = document.getElementById('tap-hint');
  const hudLevel = document.getElementById('hud-level');
  const hudScore = document.getElementById('hud-score');
  const hudTarget = document.getElementById('hud-target');
  const menuTargetDesc = document.getElementById('menu-target-desc');
  const finalScoreEl = document.getElementById('final-score');
  const highScoreEl = document.getElementById('high-score');

  // ==================== AUDIO SOUND BANKS ====================
  
  // 1. MAIN PAGE MEME AUDIO BANK (Plays on main page / load)
  const memeSounds = [
    new Audio('sounds/subway_surfers.mp3'),
    new Audio('sounds/indian_meme1.mp3'),
    new Audio('sounds/indian_meme2.mp3'),
    new Audio('sounds/chipi_chipi.mp3'),
    new Audio('sounds/moye_moye.mp3')
  ];

  // 2. IN-GAME WON SOUND BANK (Random trigger on scoring)
  const winSounds = [
    new Audio('sounds/won1.mp3'),
    new Audio('sounds/won2.mp3'),
    new Audio('sounds/won3.mp3'),
    new Audio('sounds/won4.mp3'),
    new Audio('sounds/won5.mp3'),
    new Audio('sounds/chemistry-won.mp3')
  ];

  // 3. IN-GAME LOST SOUND BANK (Random trigger on crash)
  const lostSounds = [
    new Audio('sounds/lost1.mp3'),
    new Audio('sounds/lost2.mp3'),
    new Audio('sounds/lost3.mp3'),
    new Audio('sounds/lost4.mp3'),
    new Audio('sounds/lost5.mp3')
  ];

  let currentMemeAudio = null;

  function playRandomMemeSound() {
    stopCurrentMemeSound();
    const index = Math.floor(Math.random() * memeSounds.length);
    currentMemeAudio = memeSounds[index];
    currentMemeAudio.currentTime = 0;
    currentMemeAudio.play().catch(e => console.log("User interaction required for audio playback."));
  }

  function stopCurrentMemeSound() {
    if (currentMemeAudio) {
      currentMemeAudio.pause();
      currentMemeAudio.currentTime = 0;
      currentMemeAudio = null;
    }
  }

  function playRandomWinSound() {
    const index = Math.floor(Math.random() * winSounds.length);
    const sound = winSounds[index];
    sound.currentTime = 0;
    sound.play().catch(e => {});
  }

  function playRandomLossSound() {
    const index = Math.floor(Math.random() * lostSounds.length);
    const sound = lostSounds[index];
    sound.currentTime = 0;
    sound.play().catch(e => {});
  }

  // ==================== GAME VARIABLES ====================
  let gameState = 'MENU'; // MENU, READY, PLAYING, GAMEOVER
  let score = 0;
  let level = 1;
  let targetScore = 5;
  let highScore = localStorage.getItem('flappy_high_score') || 0;
  let frameCount = 0;
  let screenShakeTimer = 0;

  // Level Targets Configuration (Level 1: 5, Level 2: 8, Level 3: 12, etc.)
  const levelTargets = [5, 8, 12, 16, 22, 30, 40, 50];

  function getTargetForLevel(lvl) {
    if (lvl <= levelTargets.length) {
      return levelTargets[lvl - 1];
    }
    return levelTargets[levelTargets.length - 1] + (lvl - levelTargets.length) * 10;
  }

  // Bird Engine State
  const bird = {
    x: 80,
    y: 280,
    radius: 14,
    gravity: 0.45,
    lift: -8.5,
    velocity: 0,
    rotation: 0
  };

  // Pillars & Particles Arrays
  let pipes = [];
  let particles = [];
  let popups = [];

  // ==================== GAME CONTROLS & LISTENERS ====================
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') handleInput();
  });

  canvas.addEventListener('mousedown', handleInput);
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInput();
  }, { passive: false });

  function handleInput() {
    if (gameState === 'READY') {
      gameState = 'PLAYING';
      tapHint.classList.add('hidden');
      bird.velocity = bird.lift;
      createFlapParticles();
    } else if (gameState === 'PLAYING') {
      bird.velocity = bird.lift;
      createFlapParticles();
    }
  }

  // ==================== GAME INITIALIZATION ====================
  function startGame() {
    stopCurrentMemeSound(); // Stop main page meme when starting game
    score = 0;
    level = 1;
    targetScore = getTargetForLevel(level);

    resetBirdPosition();
    pipes = [];
    particles = [];
    popups = [];

    updateHUD();
    mainMenu.classList.add('hidden');
    gameOverMenu.classList.add('hidden');
    tapHint.classList.remove('hidden');

    gameState = 'READY';
  }

  function returnToMainMenu() {
    gameState = 'MENU';
    gameOverMenu.classList.add('hidden');
    mainMenu.classList.remove('hidden');
    tapHint.classList.add('hidden');
    resetBirdPosition();
    updateHUD();
    playRandomMemeSound(); // Play meme sound when back on main page
  }

  function resetBirdPosition() {
    bird.x = 80;
    bird.y = canvas.height / 2;
    bird.velocity = 0;
    bird.rotation = 0;
  }

  function updateHUD() {
    hudLevel.innerText = level;
    hudScore.innerText = score;
    hudTarget.innerText = targetScore;
    menuTargetDesc.innerText = `SCORE ${targetScore} TO ADVANCE`;
  }

  // ==================== PARTICLE & JUICE EFFECTS ====================
  function createFlapParticles() {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: bird.x - 5,
        y: bird.y + 5,
        vx: (Math.random() - 0.5) * 4,
        vy: Math.random() * 3 + 1,
        radius: Math.random() * 4 + 2,
        color: '#00ffcc',
        life: 1
      });
    }
  }

  function createExplosionParticles(x, y) {
    for (let i = 0; i < 25; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        radius: Math.random() * 5 + 2,
        color: i % 2 === 0 ? '#ff0055' : '#ffcc00',
        life: 1
      });
    }
  }

  function addScorePopup(text, x, y) {
    popups.push({ text, x, y, alpha: 1, scale: 1 });
  }

  // ==================== GAME LOOP ====================
  function gameLoop() {
    frameCount++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Screen Shake effect calculation
    ctx.save();
    if (screenShakeTimer > 0) {
      screenShakeTimer--;
      const shakeX = (Math.random() - 0.5) * 12;
      const shakeY = (Math.random() - 0.5) * 12;
      ctx.translate(shakeX, shakeY);
    }

    drawBackground();

    if (gameState === 'READY') {
      // Hover bird effect on pause/ready state
      bird.y = canvas.height / 2 + Math.sin(frameCount * 0.08) * 8;
      bird.rotation = 0;
      drawBird();
    } else if (gameState === 'PLAYING') {
      updatePhysics();
      updatePipes();
      drawPipes();
      drawBird();
      checkCollisions();
    } else if (gameState === 'GAMEOVER') {
      drawPipes();
      drawBird();
    }

    updateAndDrawParticles();
    updateAndDrawPopups();

    ctx.restore();
    requestAnimationFrame(gameLoop);
  }

  // ==================== PHYSICS & ENGINE LOGIC ====================
  function updatePhysics() {
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    // Bird angle rotation based on velocity
    if (bird.velocity < 0) {
      bird.rotation = -25 * Math.PI / 180;
    } else {
      bird.rotation = Math.min(70, bird.velocity * 4) * Math.PI / 180;
    }
  }

  function updatePipes() {
    // Spawn pipes
    if (frameCount % 90 === 0) {
      const gap = Math.max(120, 160 - level * 4); // Slightly tighter gaps per level
      const minTop = 60;
      const maxTop = canvas.height - gap - 120;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: canvas.height - topHeight - gap,
        passed: false
      });
    }

    // Move pipes
    for (let i = pipes.length - 1; i >= 0; i--) {
      pipes[i].x -= (3 + Math.min(3, level * 0.3));

      // Pass & Score check
      if (!pipes[i].passed && pipes[i].x + 60 < bird.x) {
        pipes[i].passed = true;
        score++;
        playRandomWinSound();
        addScorePopup("+1", bird.x + 20, bird.y - 10);

        // Target / Level Up check
        if (score >= targetScore) {
          level++;
          targetScore = getTargetForLevel(level);
          addScorePopup("LEVEL UP!", canvas.width / 2 - 40, 150);
        }

        updateHUD();
      }

      // Remove offscreen pipes
      if (pipes[i].x < -70) {
        pipes.splice(i, 1);
      }
    }
  }

  function checkCollisions() {
    // Ceiling & Floor Collision
    if (bird.y - bird.radius <= 0 || bird.y + bird.radius >= canvas.height - 30) {
      triggerGameOver();
      return;
    }

    // Pipe Collisions
    const pipeWidth = 60;
    for (let p of pipes) {
      if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pipeWidth) {
        if (bird.y - bird.radius < p.top || bird.y + bird.radius > canvas.height - p.bottom) {
          triggerGameOver();
          return;
        }
      }
    }
  }

  function triggerGameOver() {
    gameState = 'GAMEOVER';
    screenShakeTimer = 15;
    createExplosionParticles(bird.x, bird.y);
    playRandomLossSound();

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('flappy_high_score', highScore);
    }

    finalScoreEl.innerText = score;
    highScoreEl.innerText = highScore;

    setTimeout(() => {
      gameOverMenu.classList.remove('hidden');
    }, 600);
  }

  // ==================== RENDERING (GRAPHICS) ====================
  function drawBackground() {
    // Animated City Grid Floor
    ctx.fillStyle = "#0d0f1d";
    ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
    ctx.strokeStyle = "#00ffcc";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, canvas.height - 30);
    ctx.lineTo(canvas.width, canvas.height - 30);
    ctx.stroke();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    // Glowing Outer Aura
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00ffcc";

    // Bird Body (Neon Gradient Sphere)
    const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, bird.radius);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.5, '#00ffcc');
    grad.addColorStop(1, '#0088ff');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
    ctx.fill();

    // Eye
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -4, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(7, -4, 2, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#ff0055';
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(18, 4);
    ctx.lineTo(10, 8);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawPipes() {
    const pipeWidth = 60;
    pipes.forEach(p => {
      // Top Pipe
      const gradTop = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
      gradTop.addColorStop(0, '#7928ca');
      gradTop.addColorStop(0.5, '#ff007f');
      gradTop.addColorStop(1, '#4a00e0');

      ctx.fillStyle = gradTop;
      ctx.fillRect(p.x, 0, pipeWidth, p.top);
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.strokeRect(p.x, 0, pipeWidth, p.top);

      // Bottom Pipe
      const bottomY = canvas.height - p.bottom;
      const gradBottom = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
      gradBottom.addColorStop(0, '#7928ca');
      gradBottom.addColorStop(0.5, '#ff007f');
      gradBottom.addColorStop(1, '#4a00e0');

      ctx.fillStyle = gradBottom;
      ctx.fillRect(p.x, bottomY, pipeWidth, p.bottom);
      ctx.strokeRect(p.x, bottomY, pipeWidth, p.bottom);
    });
  }

  function updateAndDrawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      let pt = particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life -= 0.03;

      if (pt.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = pt.life;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function updateAndDrawPopups() {
    for (let i = popups.length - 1; i >= 0; i--) {
      let pop = popups[i];
      pop.y -= 1.5;
      pop.alpha -= 0.02;

      if (pop.alpha <= 0) {
        popups.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = pop.alpha;
      ctx.font = '900 20px "Segoe UI", sans-serif';
      ctx.fillStyle = '#00ffcc';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00ffcc';
      ctx.fillText(pop.text, pop.x, pop.y);
      ctx.restore();
    }
  }

  // Initial Meme sound play attempt on main menu interaction
  window.addEventListener('click', () => {
    if (gameState === 'MENU' && !currentMemeAudio) {
      playRandomMemeSound();
    }
  }, { once: true });

  // Launch Engine Loop
  requestAnimationFrame(gameLoop);
</script>

</body>
</html>
